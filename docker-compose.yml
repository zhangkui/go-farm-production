# =============================================================================
# go-farm-production  full-stack Docker Compose
#   - mysql:  primary data store (8.0.46)
#   - redis:  cache, rate limiting, idempotency (7.4.10)
#   - api:    Go REST API
#   - web:    Vue 3 SPA served by Nginx (reverse-proxies /api -> api)
# Start:  docker compose up -d --build
# Tear down:  docker compose down
# Reset data:  docker compose down -v
# =============================================================================
services:
  mysql:
    image: mysql:8.4
    container_name: goxm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootsecret
      MYSQL_DATABASE: ${MYSQL_DATABASE:-farm_production}
      MYSQL_USER: ${MYSQL_USER:-farm}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-farmsecret}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --mysql-native-password=ON
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.10-bookworm
    container_name: goxm-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: goxm-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: prod
      APP_NAME: go-farm-production
      APP_DEFAULTADMIN_USERNAME: ${APP_DEFAULTADMIN_USERNAME:-admin}
      APP_DEFAULTADMIN_PASSWORD: ${APP_DEFAULTADMIN_PASSWORD:-Admin123!}
      APP_DEFAULTADMIN_EMAIL: ${APP_DEFAULTADMIN_EMAIL:-admin@farm.local}
      APP_DEFAULTADMIN_FULLNAME: ${APP_DEFAULTADMIN_FULLNAME:-系统管理员}
      HTTP_ADDR: ":8080"
      HTTP_READTIMEOUT: 15s
      HTTP_WRITETIMEOUT: 30s
      HTTP_SHUTDOWNTIMEOUT: 30s
      HTTP_MAXBODYBYTES: "10485760"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-farm}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-farmsecret}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-farm_production}
      MYSQL_MAXOPENCONNS: "50"
      MYSQL_MAXIDLECONNS: "10"
      MYSQL_CONNMAXLIFETIME: 5m
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please-32bytes-min}
      JWT_ACCESSTOKENTTL: 15m
      JWT_REFRESHTOKENTTL: 168h
      JWT_ISSUER: go-farm-production
      PASSWORD_BCRYPTCOST: "10"
      RATE_LOGINPERIPPERMIN: "5"
      RATE_LOGINPERUSERPERMIN: "10"
      RATE_WRITEPERMIN: "60"
      LOG_LEVEL: info
      LOG_FORMAT: json
    ports:
      - "8080:8080"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: goxm-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  mysql_data:
  redis_data:
