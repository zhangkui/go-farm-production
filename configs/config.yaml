# go-farm-production local development config.
# Environment variables (uppercase, dot->underscore) take precedence over this
# file; see .env.example for the full list.
app:
  name: go-farm-production
  env: dev
  defaultadmin:
    username: admin
    password: "Admin123!"
    email: admin@farm.local
    fullname: 系统管理员

http:
  addr: ":8080"
  readtimeout: 15s
  writetimeout: 30s
  idletimeout: 60s
  shutdowntimeout: 30s
  maxbodybytes: 10485760

mysql:
  host: 127.0.0.1
  port: 3306
  user: farm
  password: farmsecret
  database: farm_production
  maxopenconns: 50
  maxidleconns: 10
  connmaxlifetime: 5m

redis:
  host: 127.0.0.1
  port: 6379
  db: 0

jwt:
  secret: "change-me-in-production-please-32bytes-min"
  accesstokenttl: 15m
  refreshtokenttl: 168h
  issuer: go-farm-production

password:
  bcryptcost: 10

rate:
  loginperippermin: 5
  loginperuserpermin: 10
  writepermin: 60

log:
  level: info
  format: json
